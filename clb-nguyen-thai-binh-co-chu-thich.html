<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Câu lạc bộ Kỹ Năng Nguyễn Thái Bình</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>



/* ===== MÀU SẮC & KIỂU CHỮ: đỏ ấm, cam, kem, trắng; có chế độ tối ===== */
:root{--red:#d62b1f;--red2:#b01e14;--org:#ff8a1f;--cream:#fff4e0;--bg:#fffaf0;--card:#fff;--ink:#3a1a12;--mut:#7d5a50;--line:#f1d9c0;--ok:#1d8a4b;--shadow:0 2px 0 #f1d9c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#241310;--card:#33201b;--cream:#40251d;--ink:#fbeadb;--mut:#d0aa98;--line:#5a392e;--red:#ff5a45;--red2:#ff7a68;--shadow:0 2px 0 #5a392e}}
:root[data-theme="dark"]{--bg:#241310;--card:#33201b;--cream:#40251d;--ink:#fbeadb;--mut:#d0aa98;--line:#5a392e;--red:#ff5a45;--red2:#ff7a68;--shadow:0 2px 0 #5a392e}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
h1,h2,h3,.brand b{font-family:"Baloo 2","Segoe UI",system-ui,sans-serif;margin:0;line-height:1.15}
header{background:linear-gradient(135deg,var(--red),#f0561f 70%,var(--org));color:#fff;padding:12px 16px 0}
.top{max-width:1100px;margin:auto;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:46px;height:46px;flex:none}
.brand b{font-size:1.25rem;display:block}
.brand span{font-size:.85rem;opacity:.95}
nav{max-width:1100px;margin:10px auto 0;display:flex;gap:4px;overflow-x:auto}
nav button{background:transparent;border:0;color:#fff;font:700 .95rem "Baloo 2",sans-serif;padding:10px 14px;border-radius:12px 12px 0 0;cursor:pointer;white-space:nowrap}
nav button[aria-current=page]{background:var(--bg);color:var(--red)}
nav button:not([aria-current=page]):hover{background:rgba(255,255,255,.2)}
main{max-width:1100px;margin:auto;padding:16px}
.demo{background:var(--cream);border:2px dashed var(--org);border-radius:12px;padding:8px 12px;font-size:.88rem;margin-bottom:12px}
.hint{display:flex;gap:10px;align-items:center;justify-content:space-between;background:#fff1c9;color:#4a2a00;border-radius:12px;padding:10px 14px;margin-bottom:14px}



/* ===== NÚT BẤM ===== */
.btn{font:700 .95rem "Baloo 2",sans-serif;border:0;border-radius:999px;padding:8px 18px;cursor:pointer;background:var(--red);color:#fff;box-shadow:0 3px 0 var(--red2)}
.btn.alt{background:var(--org);color:#3a1a12;box-shadow:0 3px 0 #c9660a}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 3px 0 var(--line);border:1px solid var(--line)}
.btn.danger{background:#9b1c1c}
.btn:active{transform:translateY(2px)}
:focus-visible{outline:3px solid var(--org);outline-offset:2px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.stats{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}


/* ===== THẺ & LƯỚI (dùng cho mọi trang) ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow);position:relative}
.stat b{font:800 2.2rem "Baloo 2",sans-serif;color:var(--red);display:block;line-height:1}
.stat span{color:var(--mut);font-size:.9rem}
.cols{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));margin-top:14px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
.row .sp{flex:1}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--org);border-radius:10px;padding:6px 10px;max-width:100%}
.tool input,.tool select{border-color:var(--line)}


/* ===== CHỈNH SỬA TRỰC TIẾP: chữ gạch chấm nhấp để sửa; nút thùng rác .del ===== */
.ed{display:inline-block;min-width:3ch;border-bottom:1.5px dotted var(--org);cursor:text;border-radius:4px;padding:0 2px;word-break:break-word}
.ed:hover,.ed:focus-visible{background:#ffe3b8;color:#3a1a12;border-bottom-style:solid}
.ed:hover:after{content:" ✎";font-size:.8em;color:var(--red)}
.ed.empty{color:var(--mut);font-style:italic}
.ed input,.ed select,.ed textarea{width:100%;min-width:140px}
.f{display:flex;gap:6px;font-size:.92rem;padding:2px 0;align-items:baseline}
.f>i{font-style:normal;color:var(--mut);flex:0 0 96px}
.ttl{font-size:1.15rem;font-weight:800}
.del{position:absolute;top:8px;right:8px;border:0;background:#ffe0dc;color:#9b1c1c;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:1rem;opacity:0;transition:opacity .15s}
.card:hover .del,.card:focus-within .del,.del:focus-visible{opacity:1}
@media (hover:none){.del{opacity:.85}}


/* ===== THÀNH VIÊN: ảnh đại diện, thẻ thành viên, thẻ trạng thái ===== */
.av{width:56px;height:56px;border-radius:50%;background:var(--org);color:#fff;font:800 1.3rem "Baloo 2",sans-serif;display:grid;place-items:center;overflow:hidden;border:3px solid var(--red);cursor:pointer;flex:none;padding:0}
.av img{width:100%;height:100%;object-fit:cover}
.mh{display:flex;gap:10px;align-items:center;margin-bottom:6px;padding-right:30px}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-size:.8rem;font-weight:700;background:var(--cream);border:1px solid var(--line)}
.tag.on{background:#d9f5e3;color:#0f5f31;border-color:#9fdcb8}.tag.off{background:#eee;color:#555}
.pg{display:flex;gap:6px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.pg button{min-width:38px}
ul.l{list-style:none;margin:8px 0 0;padding:0}ul.l li{padding:8px 0;border-top:1px dashed var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
details summary{cursor:pointer;font-weight:700;color:var(--red);margin-top:6px}
.att label{display:flex;gap:8px;align-items:center;padding:2px 0}


/* ===== HỘP THOẠI & THÔNG BÁO (toast) ===== */
dialog{border:3px solid var(--org);border-radius:18px;background:var(--card);color:var(--ink);max-width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(58,26,18,.55)}
dialog .row{justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;display:grid;gap:6px;width:max-content;max-width:92vw}
.t{padding:10px 16px;border-radius:12px;color:#fff;background:var(--ok);font-weight:600}.t.err{background:#b3261e}
label.fl{display:block;font-size:.9rem;color:var(--mut)}
.empty-s{text-align:center;color:var(--mut);padding:24px}



/* ===== ĐĂNG NHẬP & KHUNG CAMERA ===== */
.tb{width:100%;border-collapse:collapse;font-size:.92rem}
.tb th,.tb td{
  padding:6px 8px;
  border-bottom:1px dashed var(--line);
  text-align:left;
  vertical-align:top;
}
.tb th{color:var(--mut);font-weight:600;white-space:nowrap}

.tabs{
  display:flex;
  gap:6px;
  overflow-x:auto;
  margin:10px 0;
  padding:0 2px 6px;
}
.tabs .btn{white-space:nowrap}

/* Khung đăng nhập căn giữa và tương thích điện thoại, iPad, máy tính */
body:not(.auth) main{
  min-height:calc(100vh - 90px);
  min-height:calc(100dvh - 90px);
  display:flex;
  align-items:center;
  justify-content:center;
}

.login{
  width:min(100%,420px);
  margin:auto;
  display:grid;
  gap:10px;
  box-sizing:border-box;
}
.login h2{text-align:center}
.login input{width:100%;min-width:0}
.login .row{justify-content:center}

@media (max-width:600px){
  body:not(.auth) main{padding:16px}
  .login{padding:18px}
}

/* Nút con mắt hiện/ẩn mật khẩu */
/* Nút con mắt hiện/ẩn mật khẩu */
.pw-wrap{display:flex;align-items:center;position:relative}
.pw-wrap input{padding-right:48px}
.pw-eye{
  position:absolute;
  right:6px;
  border:0;
  background:transparent;
  color:var(--mut);
  font-size:1.15rem;
  cursor:pointer;
  padding:4px 8px;
  border-radius:8px;
}
.pw-eye:hover{background:var(--cream);color:var(--red)}

nav button.out{margin-left:auto;background:rgba(255,255,255,.18)}
canvas,video{display:block;margin-top:10px}

/* ===== MENU DỌC BÊN TRÁI: mở/đóng, nhóm con (Quản lý thành viên, Báo cáo) ===== */
nav#nav{position:fixed;top:0;left:0;bottom:0;width:250px;max-width:85vw;z-index:20;display:flex;flex-direction:column;gap:2px;margin:0;padding:calc(12px + env(safe-area-inset-top,0px)) 10px calc(16px + env(safe-area-inset-bottom,0px));background:var(--card);border-right:3px solid var(--org);overflow-x:hidden;overflow-y:auto;transform:translateX(-105%);transition:transform .2s}
body.sb nav#nav{transform:none}
nav#nav button{color:var(--ink);text-align:left;border-radius:12px;padding:10px 14px;font-size:1rem;width:100%;white-space:normal}
nav#nav button[aria-current=page]{background:var(--red);color:#fff}
nav#nav button:not([aria-current=page]):hover{background:var(--cream)}
nav#nav button.sub{padding-left:32px;font-weight:500}
nav#nav button.closeb{background:var(--cream);margin-bottom:8px}
nav#nav button.out{margin:auto 0 0;background:var(--cream)}
nav#nav .grp{font:700 .85rem "Baloo 2",sans-serif;color:var(--mut);padding:10px 14px 2px}
#scrim{display:none;position:fixed;inset:0;background:rgba(58,26,18,.45);z-index:15}
body.sb.auth #scrim{display:block}
body:not(.auth) nav#nav,body:not(.auth) #sbt,body:not(.auth) #scrim{display:none}
@media (min-width:900px){body.sb.auth header,body.sb.auth main{margin-left:250px}body.sb #scrim{display:none}}
nav#nav button.grpb{display:flex;justify-content:space-between;align-items:center;font-weight:700}
nav#nav button.grpb.has{color:var(--red)}
</style>
</head>
<body>



 <!-- ===== THANH ĐẦU TRANG: tên & khẩu hiệu CLB, nút ☰ Menu ===== -->
<header>
  <div class="top">
    <button id="sbt" class="btn ghost" data-sb
      aria-label="Mở hoặc đóng menu" style="padding:6px 12px">☰ Menu</button>
    <div class="brand">
      <div><b id="hName"></b><span id="hSlogan"></span></div>
    </div>
  </div>
  <nav id="nav" aria-label="Điều hướng chính"></nav>
</header>


<!-- ===== NỘI DUNG CHÍNH: mỗi trang (Tổng quan, Thành viên, Blacklist, Báo cáo...) được JavaScript vẽ vào #app ===== -->
<div id="scrim" data-sb></div><main id="app"></main>
<!-- ===== HỘP THOẠI DÙNG CHUNG: xác nhận xóa + biểu mẫu tạo mới (thành viên, ban, hoạt động, mẫu) ===== -->
<dialog id="dlg"><h3 id="dT"></h3><p id="dM"></p><div id="dX"></div><div class="row" id="dB"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<!-- ===== JAVASCRIPT: toàn bộ logic ứng dụng. Xem mục lục ngay bên dưới ===== -->
<script>
/* =================== CÁCH ĐỌC FILE ===================
Các khối lớn được đánh số theo MỤC LỤC bên dưới. Dùng Ctrl+F để tìm tên khối.
Phần HTML tạo nội dung trang; phần CSS quyết định giao diện; JavaScript xử lý thao tác.
======================================================= */
/* =====================  MỤC LỤC  =====================
 1. DỮ LIỆU        : lưu trong trình duyệt (localStorage), dữ liệu mẫu (seed)
 2. PHÂN QUYỀN/MENU: admin & thành viên, menu dọc có nhóm (navFor)
 3. CHỈNH SỬA TRỰC TIẾP & KIỂM TRA DỮ LIỆU (ed, startEdit, validate)
 4. HỘP THOẠI      : xác nhận xóa (ask, del) và hộp tạo mới bắt buộc nhập tên (formDlg)
 5. QUẢN LÝ THÀNH VIÊN: trang Thành viên (members) + Blacklist (bl) + thẻ thành viên
 6. BAN/NHÓM (committees)   7. HOẠT ĐỘNG (acts, điểm danh)
 8. BÁO CÁO: Chụp ảnh (cam) + Tạo mẫu / Mẫu (tpl)
 9. CÀI ĐẶT (set)   
 10. ĐĂNG NHẬP (renderLogin)   
 11. VẼ GIAO DIỆN (render)
 12. XUẤT FILE: exportMembers() — file CSV danh sách thành viên / Blacklist (mở được bằng Excel)
======================================================= */
/* ===== 1. DỮ LIỆU: khóa lưu trữ & tiện ích nhỏ ===== */
// K là tên khóa dùng để lưu dữ liệu CLB trong localStorage của trình duyệt.
const K='ntb-club-demo-v1',today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Math.random().toString(36).slice(2,9);
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dd=n=>{const d=new Date();d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
/* ===== 1. DỮ LIỆU MẪU ban đầu (ban, thành viên, hoạt động) — nút "Đặt lại dữ liệu mẫu" dùng lại hàm này ===== */
// Tạo bộ dữ liệu mẫu ban đầu: c = ban/nhóm, m = thành viên, a = hoạt động.
function seed(){
 const c=[{id:'c1',name:'Ban Truyền thông',description:'Thiết kế, đăng bài và quay dựng các hoạt động của CLB.',leader:'Lê Minh Anh'},
 {id:'c2',name:'Ban Sự kiện',description:'Lên kế hoạch và tổ chức workshop, hội thảo, giao lưu.',leader:'Trần Quốc Bảo'},
 {id:'c3',name:'Ban Nhân sự',description:'Tuyển thành viên, chăm sóc và kết nối các bạn trong CLB.',leader:'Phạm Thu Hà'}];
 const n=[['Lê Minh Anh','c1',-200,'active'],['Trần Quốc Bảo','c2',-190,'active'],['Phạm Thu Hà','c3',-180,'active'],['Nguyễn Gia Hân','c1',-60,'active'],['Võ Đức Huy','c2',-40,'inactive'],['Đặng Ngọc Lan','c3',-12,'active'],['Bùi Thanh Tùng','c2',-8,'active'],['Hoàng Bảo Ngọc','c1',-3,'active'],['Mai Tuấn Kiệt','',-1,'active']];
 const m=n.map((x,i)=>({id:'TV'+String(i+1).padStart(3,'0'),uid:uid(),name:x[0],dob:'2006-0'+(i%9+1)+'-1'+(i%9),email:'tv'+(i+1)+'@example.com',phone:'09012345'+String(10+i),cls:'12A'+(i%4+1),committee:x[1],join:dd(x[2]),pos:i===0?'Chủ nhiệm':i===1?'Phó chủ nhiệm':i===2?'Trưởng ban':'Thành viên',status:x[3],stopDate:x[3]==='inactive'?dd(-10):'',photo:'',ts:i}));
 const a=[{id:uid(),title:'Workshop Kỹ năng thuyết trình',date:dd(5),time:'14:00',location:'Phòng đa năng A',description:'Luyện nói trước đám đông tự tin hơn.',committee:'c2',status:'upcoming',att:[]},
 {id:uid(),title:'Chụp ảnh kỷ yếu CLB',date:dd(12),time:'08:30',location:'Sân trường',description:'Chụp ảnh tập thể và chân dung thành viên.',committee:'c1',status:'upcoming',att:[]},
 {id:uid(),title:'Buổi sinh hoạt chào tân thành viên',date:dd(-7),time:'16:00',location:'Phòng sinh hoạt CLB',description:'Giới thiệu CLB và các ban.',committee:'c3',status:'done',att:[m[0].uid,m[1].uid,m[2].uid]}];
 seedAct(a,m);return{settings:{name:'Câu lạc bộ Kỹ Năng Nguyễn Thái Bình',slogan:'Năng động – Tự tin – Bền vững',email:'clb.nguyenthaibinh@example.com',pass:'admin123'},committees:c,members:m,activities:a,templates:defaultTpl(),photos:[]};
}
// S là toàn bộ dữ liệu ứng dụng. Ưu tiên đọc dữ liệu đã lưu, nếu chưa có thì dùng seed().
let S=(()=>{try{const s=JSON.parse(localStorage.getItem(K));if(s&&s.members)return s}catch(e){}return seed()})();
S.templates=S.templates||defaultTpl();S.photos=S.photos||[];S.settings.pass=S.settings.pass||'admin123';S.activities.forEach(norm);S.members.forEach(m=>{m.pos=m.pos||'Thành viên'});S.members.forEach(m=>{if(m.status==='inactive'&&!m.stopDate)m.stopDate=today()});
// Lưu toàn bộ dữ liệu S vào bộ nhớ trình duyệt trên thiết bị hiện tại.
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S));return true}catch(e){toast('Không lưu được: bộ nhớ trình duyệt đã đầy.',1);return false}};
/* ===== 2. TRẠNG THÁI: ME = người đang đăng nhập; V = trang đang xem ===== */
// ME lưu vai trò/người đang đăng nhập; sessionStorage giữ phiên cho tab/trình duyệt hiện tại.
let ME=(()=>{try{return JSON.parse(sessionStorage.getItem('ntb-me'))}catch(e){return null}})();
let V={view:(ME&&ME.role==='member')?'me':'dash',q:'',fc:'',fs:'',page:1};const PS=1e9;
/* ===== 2. PHÂN QUYỀN & MENU DỌC: navFor() liệt kê mục menu theo vai trò; ["_g",...] là tiêu đề nhóm thu/mở ===== */
const isAd=()=>!!ME&&ME.role==='admin';
const navFor=()=>isAd()?[['dash','Tổng quan'],['_g','Quản lý thành viên','mem'],['members','Thành viên','mem'],['bl','Blacklist','mem'],['committees','Ban / Nhóm'],['_g','Hoạt động','act'],['acts','Tổng quan hoạt động','act'],['hist','Lịch sử hoạt động','act'],['_g','Báo cáo','rep'],['cam','Chụp ảnh','rep'],['tpl','Tạo mẫu','rep'],['set','Cài đặt']]:[['me','Hồ sơ của tôi'],['_g','Hoạt động','act'],['acts','Tổng quan hoạt động','act'],['hist','Lịch sử hoạt động','act'],['_g','Báo cáo','rep'],['cam','Chụp ảnh','rep'],['tpl','Mẫu','rep']];
let OG={},LASTV='';
const isMgr=()=>isAd()||(!!ME&&ME.role==='member'&&['Chủ nhiệm','Phó chủ nhiệm','Trưởng ban'].includes((find('members',ME.id)||{}).pos));
const inv=a=>!!ME&&ME.role==='member'&&(a.lead===ME.id||a.staff.some(r=>r.who===ME.id)||a.tasks.some(r=>r.who===ME.id));
function can(e,id,f){if(isAd())return true;if(!ME)return false;if(e==='members')return id===ME.id&&['phone','email'].includes(f);
 if(isMgr()&&(e==='activities'||e.startsWith('sub:')))return true;
 if(e.startsWith('sub:')){const[,aid,k]=e.split(':'),a=find('activities',aid);if(k==='tasks'){const r=find(e,id);return !!r&&r.who===ME.id&&f==='status'}return !!a&&inv(a)&&['rep','inc','med'].includes(k)}return false}
/* ===== 3. DANH SÁCH LỰA CHỌN cho ô chọn (ban, trạng thái thành viên, trạng thái hoạt động) ===== */
const OPT={committee:()=>[['','Chưa phân ban'],...S.committees.map(c=>[c.id,c.name])],
 mstatus:()=>[['active','Đang hoạt động'],['inactive','Dừng hoạt động']],
 astatus:()=>[['upcoming','Sắp diễn ra'],['ongoing','Đang diễn ra'],['done','Đã hoàn thành'],['cancel','Đã hủy']]};
const fd=v=>v?v.split('-').reverse().join('/'):'';
const cName=id=>(S.committees.find(c=>c.id===id)||{}).name||'Chưa phân ban';
const find=(e,id)=>{if(e==='settings')return S.settings;if(e.startsWith('sub:')){const[,aid,k]=e.split(':'),a=S.activities.find(x=>x.id===aid),v=a&&a[k];return Array.isArray(v)?v.find(r=>r.id===id):v}return S[e].find(x=>x.id===id)};
function disp(t,v){if(t==='pass')return'••••••';if(v===''||v==null)return'Nhấp để nhập';if(t==='date')return fd(v);if(t.startsWith('sel:')){const o=OPT[t.slice(4)]().find(x=>x[0]===v);return o?o[1]:v}return v}
/* ===== 3. CHỈNH SỬA TRỰC TIẾP: ed() vẽ ô nhấp để sửa; can() quyết định ai được sửa ô nào ===== */
function ed(e,id,f,t,v,label){const emp=v===''||v==null;if(!can(e,id,f))return `<span>${E(emp?'—':disp(t,v))}</span>`;return `<span class="ed${emp?' empty':''}" role="button" tabindex="0" title="Nhấp để sửa" aria-label="Sửa ${E(label||f)}" data-e="${e}" data-i="${E(id)}" data-f="${f}" data-t="${t}">${E(disp(t,v))}</span>`}
function toast(m,err){const d=document.createElement('div');d.className='t'+(err?' err':'');d.textContent=m;document.getElementById('toast').append(d);setTimeout(()=>d.remove(),err?4500:2600)}
/* ===== 3. KIỂM TRA DỮ LIỆU: tên, email, số điện thoại, ngày sinh, mật khẩu ===== */
// Kiểm tra dữ liệu trước khi lưu: tên, số, email, điện thoại, ngày sinh và mật khẩu.
function validate(e,f,v){
 if(['name','title'].includes(f)&&!v)return 'Vui lòng nhập tên, không để trống.';
 if(['amt','qty','count','cost','est','max','expected'].includes(f)&&v&&!/^\d+$/.test(v))return 'Chỉ nhập số nguyên (không dấu chấm, phẩy).';
 if(f==='pass'&&v.length<4)return 'Mật khẩu cần ít nhất 4 ký tự.';
 if(f==='email'&&v&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))return 'Email chưa đúng định dạng (ví dụ: ten@example.com).';
 if(f==='phone'&&v&&!/^[0-9 +().-]{8,15}$/.test(v))return 'Số điện thoại cần 8–15 chữ số.';
 if(f==='dob'&&v&&v>today())return 'Ngày sinh không thể ở tương lai.';
 if(f==='id'&&!v)return 'Mã thành viên không được để trống.';
 if(f==='id'&&S.members.some(m=>m.id.toLowerCase()===v.toLowerCase()))return 'Mã thành viên này đã tồn tại.';
 return null}
/* ===== 3. Bắt đầu sửa tại chỗ: Enter/nhấp ra ngoài = lưu, Esc = hủy; đổi trạng thái thành viên → ghi ngày dừng + chuyển Blacklist ===== */
// Bắt đầu sửa một ô trên trang; Enter/làm mờ ô để lưu, Esc để hủy.
function startEdit(sp){
 if(sp.querySelector('input,select,textarea'))return;
 const {e,i,f,t}=sp.dataset;if(!can(e,i,f))return;const it=find(e,i);let val=e==='members'&&f==='id'?it.id:it[f]??'',inp;
 if(t==='area'){inp=document.createElement('textarea');inp.rows=3}
 else if(t.startsWith('sel:')){inp=document.createElement('select');OPT[t.slice(4)]().forEach(o=>{const op=new Option(o[1],o[0]);inp.add(op)})}
 else{inp=document.createElement('input');inp.type=t==='pass'?'password':t==='date'?'date':t==='time'?'time':t==='email'?'email':t==='tel'?'tel':'text'}
 inp.value=val;inp.setAttribute('aria-label',sp.getAttribute('aria-label'));
 sp.textContent='';sp.append(inp);inp.focus();if(inp.select&&t!=='date'&&t!=='time')inp.select();
 let done=false;
 const end=ok=>{if(done)return;done=true;
  if(ok){const v=inp.value.trim();
   if(v!==String(val)){const er=validate(e,f,v);if(er){toast(er,1);done=false;inp.focus();return}
    if(e==='members'&&f==='id'){S.activities.forEach(a=>{});}
    it[f]=v;let msg='Đã lưu thay đổi.';if(e==='members'&&f==='status'){if(v==='inactive'){it.stopDate=it.stopDate||today();msg='Đã chuyển '+it.name+' sang Blacklist (dừng hoạt động ngày '+fd(it.stopDate)+').'}else{it.stopDate='';msg='Đã đưa '+it.name+' trở lại danh sách thành viên.'}}if(save())toast(msg)}}
  render(true)};
 inp.addEventListener('keydown',k=>{if(k.key==='Enter'&&t!=='area'){k.preventDefault();end(true)}else if(k.key==='Escape'){k.preventDefault();end(false)}else if(k.key==='Enter'&&t==='area'&&(k.ctrlKey||k.metaKey))end(true)});
 inp.addEventListener('blur',()=>end(true));
 if(inp.tagName==='SELECT')inp.addEventListener('change',()=>end(true))}
document.addEventListener('click',e=>{const s=e.target.closest('.ed');if(s)startEdit(s)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('ed')){e.preventDefault();startEdit(e.target)}});



/* ===== 4. HỘP THOẠI XÁC NHẬN dùng chung ===== */
function ask(title,msg,btns,sel){return new Promise(r=>{
 dT.textContent=title;dM.textContent=msg;dX.innerHTML=sel?`<label class="fl">Chuyển thành viên sang:<br><select id="dS">${sel.map(o=>`<option value="${E(o[0])}">${E(o[1])}</option>`).join('')}</select></label>`:'';
 dB.innerHTML='';btns.forEach(b=>{const x=document.createElement('button');x.className='btn '+(b.c||'');x.textContent=b.l;x.onclick=()=>{const v=sel?document.getElementById('dS').value:null;dlg.close();r({v:b.v,sel:v})};dB.append(x)});
 dlg.oncancel=()=>r({v:'no'});dlg.showModal()})}
const CANCEL={l:'Hủy',v:'no',c:'ghost'};



/* ===== 4. XÓA có xác nhận: thành viên (dừng hoạt động → Blacklist / xóa hẳn), ban (chuyển thành viên), hoạt động, mẫu, báo cáo ===== */
async function del(e,id){
 if(e==='members'){const m=find(e,id);const btns=[CANCEL];if(m.status==='active')btns.push({l:'Dừng hoạt động (chuyển Blacklist)',v:'off',c:'alt'});btns.push({l:'Xóa vĩnh viễn',v:'del',c:'danger'});
  const r=await ask('Xóa thành viên?',`Bạn muốn xử lý hồ sơ “${m.name}” như thế nào? Xóa vĩnh viễn không thể khôi phục.`,btns);
  if(r.v==='off'){m.status='inactive';m.stopDate=m.stopDate||today();save();toast('Đã chuyển '+m.name+' sang Blacklist (dừng hoạt động ngày '+fd(m.stopDate)+').')}
  else if(r.v==='del'){S.members=S.members.filter(x=>x.id!==id);S.activities.forEach(a=>a.att=a.att.filter(u=>u!==m.uid));save();toast('Đã xóa thành viên.')}else return}
 else if(e==='committees'){const c=find(e,id),n=S.members.filter(m=>m.committee===id).length;
  const sel=n?[['','Chưa phân ban'],...S.committees.filter(x=>x.id!==id).map(x=>[x.id,x.name])]:null;
  const r=await ask('Xóa ban / nhóm?',n?`Ban “${c.name}” đang có ${n} thành viên. Chọn nơi chuyển họ đến — dữ liệu thành viên sẽ không bị mất.`:`Xóa ban “${c.name}”?`,[CANCEL,{l:'Xóa ban',v:'del',c:'danger'}],sel);
  if(r.v!=='del')return;S.members.forEach(m=>{if(m.committee===id)m.committee=r.sel||''});S.activities.forEach(a=>{if(a.committee===id)a.committee=''});S.committees=S.committees.filter(x=>x.id!==id);save();toast('Đã xóa ban.')}
 else if(e==='photos'){const r=await ask('Xóa báo cáo?','Báo cáo sẽ bị xóa khỏi bộ nhớ trình duyệt và không thể khôi phục.',[CANCEL,{l:'Xóa báo cáo',v:'del',c:'danger'}]);if(r.v!=='del')return;S.photos=S.photos.filter(x=>x.id!==id);save();toast('Đã xóa báo cáo.')}
 else if(e==='templates'){if(S.templates.length<2){toast('Cần giữ lại ít nhất một mẫu ảnh.',1);return}const t=find(e,id);const r=await ask('Xóa mẫu ảnh?','Xóa mẫu “'+t.name+'”? Các ảnh đã chụp vẫn được giữ nguyên.',[CANCEL,{l:'Xóa mẫu',v:'del',c:'danger'}]);if(r.v!=='del')return;S.templates=S.templates.filter(x=>x.id!==id);save();toast('Đã xóa mẫu.')}
 else{const a=find(e,id);const r=await ask('Xóa hoạt động?',`Xóa hoạt động “${a.title}”? Thao tác này không thể hoàn tác.`,[CANCEL,{l:'Xóa hoạt động',v:'del',c:'danger'}]);if(r.v!=='del')return;S.activities=S.activities.filter(x=>x.id!==id);save();toast('Đã xóa hoạt động.')}
 render()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-del]');if(b){const[x,y]=b.dataset.del.split(':');del(x,y)}});
const delBtn=(e,id,l)=>(!isAd()&&e!=='photos')?'':`<button class="del" data-del="${e}:${E(id)}" aria-label="Xóa ${E(l)}" title="Xóa">🗑</button>`;



/* ===== 4. HỘP TẠO MỚI: bắt buộc nhập tên mới được tạo (thành viên, ban, hoạt động, mẫu) ===== */
function formDlg(title,html,ok,check){return new Promise(r=>{dT.textContent=title;dM.textContent='';dX.innerHTML=html+'<p id="fe" role="alert" style="color:#b3261e;margin:6px 0 0"></p>';dB.innerHTML='';
 const no=document.createElement('button'),go=document.createElement('button');no.className='btn ghost';no.textContent='Hủy';go.className='btn';go.textContent=ok;
 const done=v=>{dlg.close();r(v)};no.onclick=()=>done(null);
 go.onclick=()=>{const o={};dX.querySelectorAll('[name]').forEach(i=>o[i.name]=i.value.trim());const er=!o.name?'Vui lòng nhập tên, không để trống.':(check&&check(o));if(er){document.getElementById('fe').textContent=er;return}done(o)};
 dX.querySelectorAll('input').forEach(i=>i.addEventListener('keydown',k=>{if(k.key==='Enter'){k.preventDefault();go.click()}}));
 dB.append(no,go);dlg.oncancel=()=>r(null);dlg.showModal();const f=dX.querySelector('[name=name]');if(f)f.focus()})}
const fld=(n,l,t,v)=>`<label class="fl">${l}<br><input name="${n}" type="${t||'text'}" value="${E(v||'')}" autocomplete="off" style="width:100%"></label>`;
// Thêm hồ sơ thành viên mới; mã TV... được tự tạo tăng dần.
async function addMember(){const o=await formDlg('Thêm thành viên',fld('name','Họ tên *')+fld('dob','Ngày sinh (để thành viên đăng nhập)','date')+`<label class="fl">Ban / Nhóm<br><select name="committee" style="width:100%">${OPT.committee().map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('')}</select></label>`,'Thêm thành viên',o=>o.dob&&o.dob>today()?'Ngày sinh không thể ở tương lai.':null);if(!o)return;
 const n=S.members.length?Math.max(...S.members.map(m=>parseInt(m.id.replace(/\D/g,''))||0))+1:1;
 S.members.unshift({id:'TV'+String(n).padStart(3,'0'),uid:uid(),name:o.name,dob:o.dob,email:'',phone:'',cls:'',committee:o.committee,join:today(),status:'active',stopDate:'',photo:'',ts:Date.now()});
 if(save())toast('Đã thêm thành viên '+o.name+'.');V={view:'members',q:'',fc:'',fs:'',page:1};render()}
// Tạo ban/nhóm mới từ hộp thoại nhập thông tin.
async function addCommittee(){const o=await formDlg('Tạo ban / nhóm mới',fld('name','Tên ban *')+fld('leader','Trưởng ban')+fld('description','Mô tả'),'Tạo ban');if(!o)return;S.committees.push({id:uid(),name:o.name,description:o.description,leader:o.leader});if(save())toast('Đã tạo ban '+o.name+'.');V.view='committees';render()}
// Tạo hoạt động mới; chỉ người có quyền quản lý mới được tạo.
async function addAct(){if(!isMgr())return;const o=await formDlg('Tạo hoạt động mới',fld('name','Tên hoạt động *')+`<label class="fl">Loại hoạt động<br><select name="type" style="width:100%">${OPT.atype().map(x=>`<option>${E(x[0])}</option>`).join('')}</select></label>`+fld('date','Ngày *','date',today())+fld('start','Giờ bắt đầu','time','08:00')+fld('end','Giờ kết thúc','time','')+fld('location','Địa điểm')+fld('org','Đơn vị tổ chức')+`<label class="fl">Người phụ trách<br><select name="lead" style="width:100%">${OPT.mem().map(x=>`<option value="${E(x[0])}">${E(x[1])}</option>`).join('')}</select></label>`+fld('expected','Số lượng dự kiến'),'Tạo hoạt động',o=>!o.date?'Vui lòng chọn ngày.':(o.expected&&!/^\d+$/.test(o.expected)?'Số lượng dự kiến chỉ nhập số.':null));if(!o)return;
 const a={id:uid(),title:o.name,type:o.type,date:o.date,time:o.start||'08:00',end:o.end,location:o.location,org:o.org,lead:o.lead,expected:o.expected,description:'',purpose:'',committee:'',status:'plan',est:'0',by:isAd()?'admin':ME.id,att:[]};norm(a);S.activities.unshift(a);if(save())toast('Đã tạo hoạt động — hồ sơ hoạt động đã mở.');V={view:'actd',aid:a.id,tab:'ov',q:'',fc:'',fs:'',page:1};render()}
/* ===== 5. ẢNH ĐẠI DIỆN thành viên (chọn ảnh có sẵn để làm avatar — khác với chụp báo cáo) ===== */
function photo(id){if(!can('members',id,'phone'))return;const i=document.createElement('input');i.type='file';i.accept='image/*';i.onchange=()=>{const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=c.height=120;const x=c.getContext('2d'),s=Math.min(im.width,im.height);x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,120,120);find('members',id).photo=c.toDataURL('image/jpeg',.8);if(save())toast('Đã cập nhật ảnh.');render(true)};im.onerror=()=>toast('Tệp không phải ảnh hợp lệ.',1);im.src=r.result};r.readAsDataURL(f)};i.click()}
const initials=n=>n.trim().split(/\s+/).slice(-2).map(w=>w[0]).join('').toUpperCase();



/* ===== 5. QUẢN LÝ THÀNH VIÊN — thẻ một thành viên (dùng cho cả trang Thành viên và Blacklist) ===== */
function memberCard(m){return `<article class="card"><div class="mh"><button class="av" data-photo="${E(m.id)}" aria-label="Đổi ảnh của ${E(m.name)}" title="Nhấp để đổi ảnh">${m.photo?`<img src="${m.photo}" alt="">`:E(initials(m.name))}</button><div><div class="ttl">${ed('members',m.id,'name','text',m.name,'họ tên')}</div><span class="tag ${m.status==='active'?'on':'off'}">${m.status==='active'?'Đang hoạt động':'Dừng hoạt động'}</span></div></div>${delBtn('members',m.id,m.name)}
 ${[['Mã','id','text'],['Ngày sinh','dob','date'],['Email','email','email'],['Điện thoại','phone','tel'],['Lớp / Khoa','cls','text'],['Ban / Nhóm','committee','sel:committee'],['Chức vụ','pos','sel:pos'],['Ngày vào CLB','join','date'],['Trạng thái','status','sel:mstatus'],...(m.status==='inactive'?[['Ngày dừng hoạt động','stopDate','date']]:[])].map(([l,f,t])=>`<div class="f"><i>${l}</i>${ed('members',m.id,f,t,m[f],l)}</div>`).join('')}</article>`}



/* ===== 5. QUẢN LÝ THÀNH VIÊN — danh sách (chỉ người đang hoạt động, một trang dài) ===== */
function memList(){const q=V.q.toLowerCase();let L=S.members.filter(m=>m.status==='active'&&(!V.fc||m.committee===(V.fc==='none'?'':V.fc))&&(!V.fs||m.status===V.fs)&&(!q||[m.name,m.id,m.email,m.cls,m.phone].join(' ').toLowerCase().includes(q)));
 const pages=Math.max(1,Math.ceil(L.length/PS));V.page=Math.min(V.page,pages);const sl=L.slice((V.page-1)*PS,V.page*PS);
 document.getElementById('ml').innerHTML=(sl.length?`<div class="grid">${sl.map(memberCard).join('')}</div>`:'<div class="empty-s">Không tìm thấy thành viên phù hợp. Hãy đổi bộ lọc hoặc thêm thành viên mới.</div>')+
 (pages>1?`<nav class="pg" aria-label="Phân trang">${Array.from({length:pages},(_,i)=>`<button class="btn ${i+1===V.page?'':'ghost'}" data-pg="${i+1}" ${i+1===V.page?'aria-current="page"':''}>${i+1}</button>`).join('')}</nav>`:'')+`<p class="empty-s">Hiển thị ${sl.length} / ${L.length} thành viên</p>`}
document.addEventListener('click',e=>{const p=e.target.closest('[data-photo]');if(p)photo(p.dataset.photo);const g=e.target.closest('[data-pg]');if(g){V.page=+g.dataset.pg;memList();window.scrollTo({top:0})}const n=e.target.closest('[data-go]');if(n){V.view=n.dataset.go;render()}const a=e.target.closest('[data-act]');if(a)({m:addMember,c:addCommittee,a:addAct,t:addTpl})[a.dataset.act]()});
document.addEventListener('change',e=>{const c=e.target.closest('[data-att]');if(c){const[a,u]=c.dataset.att.split(':'),x=find('activities',a);x.att=c.checked?[...new Set([...x.att,u])]:x.att.filter(i=>i!==u);save();render(true)}});



/* ===== CÁC TRANG: mỗi hàm bên dưới là một trang trong menu ===== */
const views={

/* ===== TRANG TỔNG QUAN (dash) ===== */
dash(){const act=S.members.filter(m=>m.status==='active').length,nw=S.members.filter(m=>m.join>=dd(-30)).length,rate=S.members.length?Math.round(act/S.members.length*100):0;

 <div class="row"><button class="btn" data-act="m">+ Thêm thành viên</button><button class="btn alt" data-act="a">+ Tạo hoạt động</button></div></div>
 <div class="grid stats" style="margin-top:14px">${[[S.members.length,'Tổng thành viên'],[nw,'Thành viên mới (30 ngày)'],[rate+'%','Tỷ lệ hoạt động'],[S.committees.length,'Số ban / nhóm']].map(x=>`<div class="card stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div>
 <div class="cols"><section class="card"><h2>Hoạt động sắp tới</h2><ul class="l">${up.map(a=>`<li><span><b>${E(a.title)}</b><br><small>${fd(a.date)} • ${E(a.time)} • ${E(a.location||'Chưa có địa điểm')}</small></span></li>`).join('')||'<li>Chưa có hoạt động sắp tới.</li>'}</ul><div class="row"><button class="btn ghost" data-go="acts">Xem tất cả</button></div></section>
 <section class="card"><h2>Thành viên mới thêm</h2><ul class="l">${rc.map(m=>`<li><span><b>${E(m.name)}</b><br><small>${E(m.id)} • ${E(cName(m.committee))}</small></span><small>${fd(m.join)}</small></li>`).join('')||'<li>Chưa có thành viên.</li>'}</ul><div class="row"><button class="btn ghost" data-go="members">Quản lý thành viên</button></div></section></div>`},

/* ===== TRANG THÀNH VIÊN (members) — trong nhóm "Quản lý thành viên" ===== */

function login() {
  const email = $('le').value.trim().toLowerCase();
  const pass = $('lp').value;

  const ADMIN_GMAIL = 'ntbskillclub2013@gmail.com';
  const ADMIN_PASSWORD = 'Ntb05102013@';

  if (!email || !pass) {
    toast('Hãy nhập Gmail và mật khẩu.', 1);
    return;
  }

  if (email === ADMIN_GMAIL) {
    if (pass !== ADMIN_PASSWORD) {
      toast('Mật khẩu chưa đúng.', 1);
      return;
    }
    ME = { role: 'admin', id: 'admin' };
  } else {
    const m = S.members.find(
      x => (x.email || '').trim().toLowerCase() === email
    );

    if (!m) {
      toast('Không tìm thấy tài khoản Gmail này.', 1);
      return;
    }
    if (m.pass !== pass) {
      toast('Mật khẩu chưa đúng.', 1);
      return;
    }
    if (m.status !== 'active') {
      toast('Tài khoản đang không hoạt động. Hãy liên hệ quản trị viên.', 1);
      return;
    }

    ME = { role: 'member', id: m.id };
  }

  try {
    sessionStorage.setItem('ntb-me', JSON.stringify(ME));

    if ($('rememberLogin').checked) {
      localStorage.setItem('ntb-remember-session', JSON.stringify(ME));
    } else {
      localStorage.removeItem('ntb-remember-session');
    }
  } catch (e) {}

  V = { view: isAd() ? 'dash' : 'me', q: '', fc: '', fs: '', page: 1 };
  render();
  toast('Đăng nhập thành công.');
}

function logout() {
  stopCam();
  ME = null;

  try {
    sessionStorage.removeItem('ntb-me');
    localStorage.removeItem('ntb-remember-session');
  } catch (e) {}

  V = { view: 'dash', q: '', fc: '', fs: '', page: 1 };
  setSb(false);
  render();
  toast('Đã đăng xuất.');
}

 ov:a=>{const t=a.tasks.filter(r=>r.status==='done').length;return `<p><small>${OPT.wf().slice(0,9).map(o=>o[0]===a.status?`<b>${o[1]}</b>`:o[1]).join(' → ')}</small></p>`+fl(a,'activities',a.id,[['Tên hoạt động','title','text'],['Loại','type','sel:atype'],['Ngày','date','date'],['Giờ bắt đầu','time','time'],['Giờ kết thúc','end','time'],['Địa điểm','location','text'],['Đơn vị tổ chức','org','text'],['Người phụ trách','lead','sel:mem'],['Ban phụ trách','committee','sel:committee'],['Số lượng dự kiến','expected','text'],['Mục đích','purpose','area'],['Nội dung','description','area'],['Trạng thái','status','sel:wf']])+`<p>Công việc hoàn thành: <b>${t}/${a.tasks.length}</b></p>`},
 staff:a=>lst(a,'staff',[['Thành viên','who','sel:mem'],['Vai trò','role','sel:srole'],['Ghi chú','note']],'Thêm nhân sự'),
 tasks:a=>lst(a,'tasks',[['Công việc','name'],['Người phụ trách','who','sel:mem'],['Deadline','due','date'],['Ưu tiên','pri','sel:pri'],['Trạng thái','status','sel:tstat'],['Cần minh chứng','proof','sel:yn']],'Giao nhiệm vụ')+'<p><small>Nhiệm vụ cần minh chứng: người phụ trách chụp ở Báo cáo → Chụp ảnh và chọn nhiệm vụ đó; ảnh lưu xong, nhiệm vụ tự chuyển Hoàn thành.</small></p>',
 tl:a=>lst(a,'tl',[['Giờ','time','time'],['Nội dung','text']],'Thêm mốc thời gian'),
 reg:a=>{const e='sub:'+a.id+':reg',g=a.regs.filter(r=>r.st!=='no').length;return fl(a,e,'x',[['Cho phép đăng ký','on','sel:yn'],['Số lượng tối đa (0 = không giới hạn)','max','text'],['Hạn đăng ký','deadline','date'],['Ai được đăng ký','who','sel:regw'],['Cần duyệt','approve','sel:yn']],a.reg)+`<p>Đã đăng ký: <b>${g}${+a.reg.max?'/'+a.reg.max:''}</b></p>`+(ME.role==='member'?`<div class="row"><button class="btn" data-reg="${a.id}">ĐĂNG KÝ THAM GIA</button></div>`:'')+lst(a,'regs',[['Thành viên','who','sel:mem'],['Trạng thái','st','sel:rst']],'Thêm người đăng ký')},
 att:a=>{const late=a.chk.filter(r=>r.in&&a.time&&r.in>a.time).length,early=a.chk.filter(r=>r.out&&a.end&&r.out<a.end).length;return `<p>👥 <b>${a.chk.length}${+a.expected?'/'+a.expected:''}</b> có mặt • ⏰ <b>${late}</b> đi trễ • 🏃 <b>${early}</b> về sớm</p><p><small>Mã QR check-in chưa có trong bản demo: thành viên bấm nút bên dưới, hoặc được check-in tự động khi chụp báo cáo.</small></p>`+(ME.role==='member'?`<div class="row"><button class="btn" data-chk="${a.id}:in">Check-in bây giờ</button><button class="btn alt" data-chk="${a.id}:out">Check-out</button></div>`:'')+lst(a,'chk',[['Thành viên','who','sel:mem'],['Check-in','in','time'],['Check-out','out','time']],'Thêm điểm danh')},
 sup:a=>lst(a,'sup',[['Vật tư','name'],['Số lượng','qty'],['Đã chuẩn bị','ready','chk'],['Đã nhận','got','chk'],['Đã trả','back','chk']],'Thêm vật tư'),
 bud:a=>{const sp=a.bud.reduce((n,r)=>n+(+r.amt||0),0),es=+a.est||0,m=n=>n.toLocaleString('vi-VN')+'đ';return `<div class="f"><i>Dự toán (đ)</i>${ed('activities',a.id,'est','text',a.est,'dự toán')}</div><p>Đã chi: <b>${m(sp)}</b> • Còn lại: <b style="color:${es-sp<0?'#b3261e':'inherit'}">${m(es-sp)}</b></p>`+lst(a,'bud',[['Nội dung','name'],['Số tiền (đ)','amt']],'Thêm khoản chi')},
 inc:a=>lst(a,'inc',[['Giờ','time','time'],['Sự cố','text'],['Người ghi nhận','who','sel:mem'],['Mức độ','lvl','sel:lvl'],['Người xử lý','fixer'],['Kết quả','res']],'⚠️ Ghi nhận sự cố'),
 med:a=>lst(a,'med',[['Loại','kind','sel:mkind'],['Tên','name'],['Liên kết (Facebook / TikTok / Drive / Canva)','url']],'Thêm media')+`<h3>Báo cáo ảnh đã chụp</h3><div class="row">${S.photos.filter(p=>p.act===a.id).map(p=>`<img src="${p.data}" alt="Báo cáo" data-zoom="${p.id}" style="width:90px;height:90px;object-fit:cover;border-radius:10px;cursor:zoom-in">`).join('')||'<small>Chưa có ảnh báo cáo cho hoạt động này.</small>'}</div>`,
 rep:a=>{const r=a.rep,stg={draft:'Đang soạn',tb:'Chờ Trưởng ban duyệt',bcn:'Chờ BCN duyệt',ok:'✅ Đã duyệt'},b=(t,l,c)=>`<button class="btn ${c||''}" data-rstage="${a.id}:${t}">${l}</button>`;
  return `<p><b>Trạng thái báo cáo:</b> ${stg[r.stage]} <small>(Người lập → Trưởng ban → BCN duyệt)</small></p>`+fl(a,'sub:'+a.id+':rep','x',[['Hoạt động thực tế','actual','area'],['Số người tham gia','count','text'],['Kết quả','result','area'],['Thành tích','achv','area'],['Vấn đề phát sinh','issues','area'],['Kinh phí thực tế','cost','text'],['Kiến nghị','advice','area']],r)+`<div class="row">${r.stage==='draft'&&(inv(a)||isMgr())?b('tb','Gửi Trưởng ban duyệt'):''}${isMgr()&&r.stage==='tb'?b('bcn','Trưởng ban duyệt')+b('draft','Trả về soạn lại','ghost'):''}${isMgr()&&r.stage==='bcn'?b('ok','BCN duyệt – hoàn tất')+b('draft','Trả về soạn lại','ghost'):''}</div><p><small>Hình ảnh: tab Media. File đính kèm: dán liên kết Drive ở tab Media.</small></p>`}};
async function sAdd(aid,k){const a=find('activities',aid),d=SADD[k];if(!a||!d)return;
 const h=d[2]==='m'?`<label class="fl">${d[1]}<br><select name="name" style="width:100%"><option value="">— Chọn —</option>${S.members.filter(m=>m.status==='active').map(m=>`<option value="${E(m.id)}">${E(m.name)} (${E(m.id)})</option>`).join('')}</select></label>`:fld('name',d[1]);
 const o=await formDlg('Thêm: '+d[1].replace(' *',''),h,'Thêm');if(!o)return;
 const row=Object.assign({id:uid()},JSON.parse(JSON.stringify(SDEF[k])));row[d[0]]=o.name;if(k==='inc'){row.who=ME.role==='member'?ME.id:''}a[k].push(row);save();toast('Đã thêm.');render(true)}
async function sDel(aid,k,rid){if(!isMgr())return;const r=await ask('Xóa dòng này?','Dòng sẽ bị xóa khỏi hồ sơ hoạt động.',[CANCEL,{l:'Xóa',v:'del',c:'danger'}]);if(r.v!=='del')return;const a=find('activities',aid);a[k]=a[k].filter(x=>x.id!==rid);save();render(true)}
function copyAct(id){if(!isMgr())return;const o=JSON.parse(JSON.stringify(find('activities',id))),nid=()=>uid();o.id=uid();o.title+=' (bản sao)';o.status='plan';o.chk=[];o.att=[];o.regs=[];o.inc=[];o.med=[];o.by=isAd()?'admin':ME.id;o.rep={stage:'draft',actual:'',count:'',result:'',achv:'',issues:'',cost:'',advice:''};
 ['staff','tasks','tl','sup','bud'].forEach(k=>o[k].forEach(r=>{r.id=nid();if(k==='tasks'){r.status='todo';delete r.proofPhoto}if(k==='sup'){r.ready=r.got=r.back=0}}));S.activities.unshift(o);save();toast('Đã sao chép — hãy chỉnh ngày và người phụ trách.');V={view:'actd',aid:o.id,tab:'ov'};render()}
function rStage(aid,to){const a=find('activities',aid);if(!a)return;if(to!=='tb'&&!isMgr())return;a.rep.stage=to;if(to==='tb'&&['approved','prep','live','ended'].includes(a.status))a.status='awaitrep';if(to==='ok')a.status='done';save();toast('Đã cập nhật báo cáo.');render(true)}
function regMe(aid){const a=find('activities',aid),m=find('members',ME.id);let er='';if(a.reg.on!=='yes')er='Hoạt động này chưa mở đăng ký.';else if(a.reg.deadline&&today()>a.reg.deadline)er='Đã hết hạn đăng ký.';else if(+a.reg.max&&a.regs.filter(r=>r.st!=='no').length>=+a.reg.max)er='Đã đủ số lượng đăng ký.';else if(a.regs.some(r=>r.who===ME.id))er='Bạn đã đăng ký rồi.';else if(a.reg.who==='ban'&&a.committee&&m.committee!==a.committee)er='Hoạt động này chỉ dành cho ban phụ trách.';
 if(er){toast(er,1);return}a.regs.push({id:uid(),who:ME.id,st:a.reg.approve==='yes'?'wait':'ok'});save();toast(a.reg.approve==='yes'?'Đã gửi đăng ký, chờ duyệt.':'Đăng ký thành công.');render(true)}
function chkMe(aid,k){const a=find('activities',aid),t=new Date().toTimeString().slice(0,5);let r=a.chk.find(x=>x.who===ME.id);if(k==='in'){if(r){toast('Bạn đã check-in lúc '+r.in+'.',1);return}a.chk.push({id:uid(),who:ME.id,in:t,out:''})}else{if(!r){toast('Bạn chưa check-in.',1);return}r.out=t}save();toast(k==='in'?'Đã check-in '+t+'.':'Đã check-out '+t+'.');render(true)}
document.addEventListener('click',e=>{let x;const g=q=>(x=e.target.closest(q));
 if(g('[data-open]')){V.view='actd';V.aid=x.dataset.open;V.tab='ov';render();scrollTo(0,0)}
 else if(g('[data-tab]')){V.tab=x.dataset.tab;render(true)}
 else if(g('[data-af]')){V.af=x.dataset.af;render(true)}
 else if(g('[data-hy]')){V.hy=x.dataset.hy;render(true)}
 else if(g('[data-sadd]'))sAdd(...x.dataset.sadd.split(':'));
 else if(g('[data-sdel]'))sDel(...x.dataset.sdel.split(':'));
 else if(g('[data-copy]'))copyAct(x.dataset.copy);
 else if(g('[data-rstage]'))rStage(...x.dataset.rstage.split(':'));
 else if(g('[data-reg]'))regMe(x.dataset.reg);
 else if(g('[data-chk]'))chkMe(...x.dataset.chk.split(':'))});
document.addEventListener('change',e=>{const c=e.target.closest('[data-sc]');if(c){const[aid,k,rid,f]=c.dataset.sc.split(':'),en='sub:'+aid+':'+k,r=find(en,rid);if(r&&can(en,rid,f)){r[f]=c.checked?1:0;save()}}});
render();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NTB Skill Club</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff5f5;
            text-align: center;
        }

        .box {
            margin: 100px auto;
            padding: 40px;
            max-width: 500px;
            background: white;
            border-radius: 20px;
            box-shadow: 0 5px 20px #ddd;
        }

        h1 {
            color: #d94f5c;
        }

        button {
            padding: 12px 25px;
            border: none;
            border-radius: 10px;
            background: #e8757f;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #d94f5c;
        }

        #message {
            margin-top: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">
        <h1>🔥 NTB SKILL CLUB</h1>
        <p>Website đang hoạt động!</p>

        <button onclick="testWeb()">Bấm thử</button>

        <div id="message"></div>
    </div>

    <script>
        function testWeb() {
            document.getElementById("message").innerHTML =
                "✅ GitHub Pages chạy thành công!";
        }
    </script>

</body>
  </html>
